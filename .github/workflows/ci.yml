name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Unit tests + full spec suite on all three consumer OSes: OS-gated code
    # and OS-sensitive behavior (fs paths, symlinks, case, platform libm)
    # are invisible to an ubuntu-only gate. Release binaries build on these
    # same OSes (see release.yml), so this matrix also proves the cgo
    # toolchain each release leg relies on.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # cache disabled while the repo is private
          # cache: true
      # The test/spec binaries link C libm unconditionally (`sassmathcgo`
      # has no build tag), so every leg needs a working C compiler: gcc
      # ships on ubuntu runners, clang on macOS runners, mingw gcc on
      # Windows runners. Probe it loudly — a missing compiler would
      # otherwise surface as a cryptic cgo failure deep in `go build`.
      - name: Probe C toolchain
        run: gcc --version && go env CGO_ENABLED
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi
      - name: Unit tests
        run: go test ./...
      - name: sass-spec suite
        # Windows/macOS runners are slower than ubuntu; the suite takes
        # ~10s on Linux.
        env:
          SASS_SPEC_PATH: ../sass-spec/spec
        run: go test -tags=spec -timeout=300s ./spec/
